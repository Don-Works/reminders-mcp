# CI for reminders-mcp.
#
# swift test exercises the RemindersCore library (date parsing/serialization,
# priority, colour, recurrence/alarm construction) — no EventKit store access,
# so it needs no TCC grant and no Reminders.app. The live-store behaviour is
# covered by scripts/smoke_test.py, which deliberately does NOT run here: it
# creates and deletes real reminder rows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: swift test -Xswiftc -warnings-as-errors
      - name: Release build
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: JSON-RPC and MCP protocol checks
        run: python3 scripts/protocol_test.py .build/release/reminders-mcp
